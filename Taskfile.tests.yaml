version: 3

silent: true

tasks:
  default:
    desc: Run non-billable HTTP tests in an isolated temporary server
    cmds:
      - bun run scripts/smoke-http.ts
  compiled:
    desc: Qualify the production binary, isolated HTTP and source-free data worker
    cmds:
      - bun run test:compiled
  verify:
    desc: Static, regression, offline, reference and source HTTP qualification
    cmds:
      - bun run verify
  docker:
    desc: Qualify an owned production container with no external network or retained mounts
    cmds:
      - bun run test:docker
