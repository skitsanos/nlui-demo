name: Qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NLUI_EVAL_LIVE: "0"
  OPENAI_API_KEY: ""
  CHAT_MODEL: ""

jobs:
  source-compiled:
    name: Source and compiled (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Frozen application dependencies
        run: bun install --frozen-lockfile
      - name: Install required Hurl CLI
        run: |
          mkdir -p "$RUNNER_TEMP/hurl"
          bun add --trust --cwd "$RUNNER_TEMP/hurl" @orangeopensource/hurl@8.0.4
          echo "$RUNNER_TEMP/hurl/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Record tool versions
        run: |
          bun --version
          hurl --version
      - name: Static, regression, offline, reference and source HTTP gates
        run: bun run verify
      - name: Production binary HTTP and source-free data worker gates
        run: bun run test:compiled

  container:
    name: Production container (Linux)
    runs-on: ubuntu-latest
    needs: source-compiled
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Pull/build image and qualify without external networking or retained mounts
        run: bun run test:docker
